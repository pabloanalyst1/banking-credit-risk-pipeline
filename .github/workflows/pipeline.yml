name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 2 * *"   # 2nd day of every month, after month-end close
  workflow_dispatch:

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Run pipeline (live Banguat FX, falls back if unavailable)
        run: python run_pipeline.py

      - name: Upload dashboard exports
        uses: actions/upload-artifact@v4
        with:
          name: exports
          path: exports/*.csv
